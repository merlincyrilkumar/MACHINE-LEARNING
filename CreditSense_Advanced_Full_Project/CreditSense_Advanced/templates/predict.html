{% extends 'base.html' %}{% block content %}<h1>Loan Risk Prediction</h1><div class="form-card"><form method="post"><div class="grid"><label>Loan Amount<input name="loan_amnt" type="number" min="1" step=".01" required></label><label>Annual Income<input name="annual_inc" type="number" min="1" step=".01" required></label><label>Term<select name="term_months"><option value="36">36 months</option><option value="60">60 months</option></select></label><label>Interest Rate (%)<input name="int_rate" type="number" min=".01" max="40" step=".01" required></label><label>Installment<input name="installment" type="number" min=".01" step=".01" required></label><label>Home Ownership<select name="home_ownership"><option>RENT</option><option>OWN</option><option>MORTGAGE</option><option>OTHER</option></select></label><label>Verification Status<select name="verification_status"><option>Verified</option><option>Source Verified</option><option>Not Verified</option></select></label><label>Purpose<select name="purpose">{% for p in purposes %}<option value="{{p}}">{{p.replace('_',' ').title()}}</option>{% endfor %}</select></label></div><button class="button">Analyze Risk</button></form></div>{% if error %}<div class="flash error">{{error}}</div>{% endif %}{% if result %}<div class="result"><span>PREDICTION RESULT</span><h2>{{result.risk}}</h2><div class="prob">{{result.probability}}%</div><div class="bar"><span style="width:{{result.probability}}%"></span></div><a class="button" href="/report/{{result.id}}">View Report</a></div>{% endif %}{% endblock %}
